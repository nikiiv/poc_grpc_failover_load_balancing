services:
  broker:
    image: poc/lifecycle-broker:latest
    build:
      context: .
      dockerfile: lifecycle-broker/Dockerfile
    container_name: broker
    hostname: broker
    environment:
      # On startup, the broker queries Consul (?passing) and pre-seeds its in-memory
      # cluster view. Recovers from a broker restart even if no node re-announces.
      CONSUL_TARGET: consul:8500
    ports:
      - "7100:7100"
    depends_on: [consul]
    networks: [poc-net]

  consul:
    # Dev mode: in-memory, single node, no auth. Perfect for the POC.
    # UI on http://localhost:8500/ui/  · HTTP API on :8500  · DNS on :8600.
    image: docker.io/hashicorp/consul:1.20
    container_name: consul
    hostname: consul
    command: agent -dev -client=0.0.0.0 -log-level=INFO
    ports:
      - "8500:8500"
      - "8600:8600/udp"
    networks: [poc-net]

  # ─── Trading bucket ───
  bff-t-1: &bff-base
    image: poc/bff:latest
    build:
      context: .
      dockerfile: bff/Dockerfile
    container_name: bff-t-1
    hostname: bff-t-1
    environment:
      ROLE: trading
      NODE_ID: bff-t-1
      BROKER_TARGET: broker:7100
      CONSUL_TARGET: consul:8500
      ADVERTISED_ADDRESS: bff-t-1:8080
    depends_on: [broker, consul]
    networks: [poc-net]

  bff-t-2:
    <<: *bff-base
    container_name: bff-t-2
    hostname: bff-t-2
    environment:
      ROLE: trading
      NODE_ID: bff-t-2
      BROKER_TARGET: broker:7100
      CONSUL_TARGET: consul:8500
      ADVERTISED_ADDRESS: bff-t-2:8080

  bff-t-3:
    <<: *bff-base
    container_name: bff-t-3
    hostname: bff-t-3
    environment:
      ROLE: trading
      NODE_ID: bff-t-3
      BROKER_TARGET: broker:7100
      CONSUL_TARGET: consul:8500
      ADVERTISED_ADDRESS: bff-t-3:8080
    profiles: [extra]

  server-t-1: &server-base
    image: poc/grpc-server:latest
    build:
      context: .
      dockerfile: grpc-server/Dockerfile
    container_name: server-t-1
    hostname: server-t-1
    environment:
      SERVER_ID: server-t-1
      SERVER_PORT: 9101
      ROLE: trading
      BROKER_TARGET: broker:7100
      CONSUL_TARGET: consul:8500
    depends_on: [broker, consul]
    networks: [poc-net]

  server-t-2:
    <<: *server-base
    container_name: server-t-2
    hostname: server-t-2
    environment:
      SERVER_ID: server-t-2
      SERVER_PORT: 9101
      ROLE: trading
      BROKER_TARGET: broker:7100
      CONSUL_TARGET: consul:8500

  server-t-3:
    <<: *server-base
    container_name: server-t-3
    hostname: server-t-3
    environment:
      SERVER_ID: server-t-3
      SERVER_PORT: 9101
      ROLE: trading
      BROKER_TARGET: broker:7100
      CONSUL_TARGET: consul:8500
    profiles: [extra]

  # ─── Billing bucket ───
  bff-b-1:
    <<: *bff-base
    container_name: bff-b-1
    hostname: bff-b-1
    environment:
      ROLE: billing
      NODE_ID: bff-b-1
      BROKER_TARGET: broker:7100
      CONSUL_TARGET: consul:8500
      ADVERTISED_ADDRESS: bff-b-1:8080

  bff-b-2:
    <<: *bff-base
    container_name: bff-b-2
    hostname: bff-b-2
    environment:
      ROLE: billing
      NODE_ID: bff-b-2
      BROKER_TARGET: broker:7100
      CONSUL_TARGET: consul:8500
      ADVERTISED_ADDRESS: bff-b-2:8080

  server-b-1:
    <<: *server-base
    container_name: server-b-1
    hostname: server-b-1
    environment:
      SERVER_ID: server-b-1
      SERVER_PORT: 9101
      ROLE: billing
      BROKER_TARGET: broker:7100
      CONSUL_TARGET: consul:8500

  server-b-2:
    <<: *server-base
    container_name: server-b-2
    hostname: server-b-2
    environment:
      SERVER_ID: server-b-2
      SERVER_PORT: 9101
      ROLE: billing
      BROKER_TARGET: broker:7100
      CONSUL_TARGET: consul:8500

  ui:
    image: poc/ui:latest
    build:
      context: .
      dockerfile: web-client/Dockerfile
    container_name: ui
    hostname: ui
    ports:
      - "5173:80"
    depends_on: [bff-t-1, bff-t-2, bff-b-1, bff-b-2]
    networks: [poc-net]

networks:
  poc-net:
    name: poc-net
