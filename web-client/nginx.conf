upstream trading_bff {
    server bff-t-1:8080 max_fails=1 fail_timeout=5s;
    server bff-t-2:8080 max_fails=1 fail_timeout=5s;
    # Third BFF — kept commented out at startup because OSS nginx requires every
    # upstream hostname to resolve at config-load time, and bff-t-3 doesn't exist
    # in the Docker network until you `./bin/compose --profile extra up -d bff-t-3`.
    # To wire it in live, see bin/demo step 7 (sed + nginx -s reload).
    # server bff-t-3:8080 max_fails=1 fail_timeout=5s;
    # No `keepalive N` — without it, every nginx → BFF request opens a fresh TCP
    # connection. Costs a few ms but gives strictly fair round-robin (with `keepalive`,
    # nginx biases toward upstreams it already has warm connections to, which makes
    # a newly-added BFF underused for a while).
}

upstream billing_bff {
    server bff-b-1:8080 max_fails=1 fail_timeout=5s;
    server bff-b-2:8080 max_fails=1 fail_timeout=5s;
    # No `keepalive N` — without it, every nginx → BFF request opens a fresh TCP
    # connection. Costs a few ms but gives strictly fair round-robin (with `keepalive`,
    # nginx biases toward upstreams it already has warm connections to, which makes
    # a newly-added BFF underused for a while).
}

# Common proxy settings reused on all /api/{role}/* locations.
# Defined as a map of empty string → value to make `include`-able; here we inline.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # /api/trading/echo  →  bff-{t-1,t-2}:8080/api/echo
    location /api/trading/ {
        rewrite ^/api/trading/(.*)$ /api/$1 break;
        proxy_pass http://trading_bff;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_connect_timeout       2s;
        proxy_send_timeout          60s;
        proxy_read_timeout          1h;
        proxy_next_upstream         error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries   3;
        proxy_next_upstream_timeout 5s;
        proxy_buffering off;
        proxy_cache off;
    }

    # /api/billing/echo  →  bff-{b-1,b-2}:8080/api/echo
    location /api/billing/ {
        rewrite ^/api/billing/(.*)$ /api/$1 break;
        proxy_pass http://billing_bff;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_connect_timeout       2s;
        proxy_send_timeout          60s;
        proxy_read_timeout          1h;
        proxy_next_upstream         error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries   3;
        proxy_next_upstream_timeout 5s;
        proxy_buffering off;
        proxy_cache off;
    }
}
